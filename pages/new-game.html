<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Нова гра</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <meta name="theme-color" content="#0d0b09">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <script src="../assets/js/pwa.js" defer></script>
</head>
<body data-page="new-game">

  <main>
    <h1 class="page-title">Нова гра</h1>
    <form class="narrow stack" id="new-game-form" autocomplete="off">

      <div class="panel stack">
        <h2>Ваш персонаж</h2>
        <figure class="pic" style="max-width:240px; margin:0 auto">
          <span class="hero-sprite" role="img" aria-label="Персонаж" style="background-image:url('../assets/images/Heroes_start.webp'); background-size:301.5625% 200.78125%; background-position:0% 0%"></span>
        </figure>
        <label class="field">
          Ім'я персонажа
          <input type="text" name="name" maxlength="20" required placeholder="Введіть ім'я">
        </label>
        <p class="note" data-anchor="heading">Професія: Рекрут. Старт у Домівці — дерев'яний меч, лляна сорочка й штани, щит і чоботи в інвентарі, кілька зілль. Атрибути: Сила, Спритність, Інтелект, Витривалість, Дух — по 1, +3 очки за кожен рівень.</p>
      </div>

      <button class="wf wf-button" type="submit">Почати гру</button>
      <div class="msg" id="msg" role="status" hidden></div>

      <a class="wf wf-link" href="../index.html" data-back>Назад</a>
    </form>
  </main>

  <script src="../assets/js/core.js" defer></script>
  <script src="../assets/js/ui.js" defer></script>
  <script src="../assets/js/data/levels.js" defer></script>
  <script src="../assets/js/data/items.js" defer></script>
  <script src="../assets/js/data/classes.js" defer></script>
  <script src="../assets/js/stats.js" defer></script>
  <script src="../assets/js/data/enemies.js" defer></script>
  <script src="../assets/js/data/skills.js" defer></script>
  <script src="../assets/js/quests.js" defer></script>
  <script src="../assets/js/rarity.js" defer></script>
  <script src="../assets/js/save.js" defer></script>
  <script src="../assets/js/character.js" defer></script>
  <script src="../assets/js/party.js" defer></script>
  <script src="../assets/js/battle.js" defer></script>
  <script src="../assets/js/data/routes.js" defer></script>
  <script src="../assets/js/travel.js" defer></script>
  <script src="../assets/js/game.js" defer></script>
  <script src="../assets/js/menu.js" defer></script>
</body>
</html>
