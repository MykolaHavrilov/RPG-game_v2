<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Інвентар</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/game.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <meta name="theme-color" content="#0d0b09">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <script src="../assets/js/pwa.js" defer></script>
</head>
<body data-page="inventory">

  <header>
    <nav>
      <a class="wf wf-link" href="game.html">Локація</a>
      <a class="wf wf-link" href="character.html">Персонаж</a>
      <a class="wf wf-link" href="maps.html">Мапа</a>
      <a class="wf wf-link" href="inventory.html" aria-current="page">Інвентар</a>
      <a class="wf wf-link" href="settings.html?from=inventory">Налаштування</a>
      <a class="wf wf-link" href="../index.html">Головне меню</a>
    </nav>
  </header>

  <main>
    <!-- Герої групи: у кожного своє спорядження, інвентар і скриня — спільні -->
    <div class="row member-tabs" id="member-tabs" hidden></div>
    <div class="row">

      <section class="panel stack" style="flex:1 1 280px">
        <h2 id="equip-title">Спорядження</h2>
        <div class="equip-grid" id="equip-list"></div>
      </section>

      <section class="stack" style="flex:2 1 460px">
        <div class="panel stack">
          <div class="inv-head">
            <h2>Предмети</h2>
            <span id="gold">Золото: 0</span>
          </div>
          <!-- Кишеня ключів від данжів — окреме вікно (game.js → showKeyPocket) -->
          <button class="wf wf-link key-pocket-btn" id="key-pocket-btn" type="button">Кишеня ключів</button>
          <div class="slots slots-12" id="item-grid"></div>
        </div>

        <div class="panel stack">
          <div class="inv-head">
            <h2 id="chest-title">Скриня</h2>
            <span class="note" id="chest-note"></span>
          </div>
          <div class="slots slots-12" id="chest-grid"></div>
        </div>

        <div class="msg" id="msg" role="status" hidden></div>

        <a class="wf wf-link" href="game.html">Назад до локації</a>
      </section>
    </div>
  </main>

  <script src="../assets/js/core.js" defer></script>
  <script src="../assets/js/ui.js" defer></script>
  <script src="../assets/js/data/levels.js" defer></script>
  <script src="../assets/js/data/items.js" defer></script>
  <script src="../assets/js/data/classes.js" defer></script>
  <script src="../assets/js/stats.js" defer></script>
  <script src="../assets/js/data/enemies.js" defer></script>
  <script src="../assets/js/data/skills.js" defer></script>
  <script src="../assets/js/quests.js" defer></script>
  <script src="../assets/js/rarity.js" defer></script>
  <script src="../assets/js/gearscore.js" defer></script>
  <script src="../assets/js/monstergear.js" defer></script>
  <script src="../assets/js/dungeon.js" defer></script>
  <script src="../assets/js/save.js" defer></script>
  <script src="../assets/js/character.js" defer></script>
  <script src="../assets/js/party.js" defer></script>
  <script src="../assets/js/battle.js" defer></script>
  <script src="../assets/js/data/routes.js" defer></script>
  <script src="../assets/js/travel.js" defer></script>
  <script src="../assets/js/game.js" defer></script>
  <script src="../assets/js/menu.js" defer></script>
</body>
</html>
