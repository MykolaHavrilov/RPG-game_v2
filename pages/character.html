<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Персонаж</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/game.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <meta name="theme-color" content="#0d0b09">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <script src="../assets/js/pwa.js" defer></script>
</head>
<body data-page="character">

  <header>
    <nav>
      <a class="wf wf-link" href="game.html">Локація</a>
      <a class="wf wf-link" href="character.html" aria-current="page">Персонаж</a>
      <a class="wf wf-link" href="maps.html">Мапа</a>
      <a class="wf wf-link" href="inventory.html">Інвентар</a>
      <a class="wf wf-link" href="settings.html?from=character">Налаштування</a>
      <a class="wf wf-link" href="../index.html">Головне меню</a>
    </nav>
  </header>

  <main>
    <!-- Герої групи: атрибути, характеристики й спорядження кожного окремо -->
    <div class="row member-tabs" id="member-tabs" hidden></div>
    <!-- Верх: герой і смужки під ним | журнал квестів | карусель «Атрибути / Характеристики / Розвиток» -->
    <div class="char-top">
      <div class="stack char-left">
        <figure class="pic char-pic">
          <span id="hero-img" class="hero-sprite" role="img" aria-label="Персонаж"></span>
          <figcaption id="hero-name">Персонаж</figcaption>
        </figure>
        <div class="stats">
          <div class="bar bar-hp" id="hero-hp" data-name="HP"><div class="bar-fill"></div><span class="bar-label">HP</span></div>
          <div class="bar bar-mp" id="hero-mp" data-name="MP"><div class="bar-fill"></div><span class="bar-label">MP</span></div>
          <div class="exp-row">
            <div class="bar bar-exp" id="hero-exp" data-name="EXP"><div class="bar-fill"></div><span class="bar-label">EXP</span></div>
            <div class="bar bar-lvl" id="hero-lvl">LVL 1</div>
          </div>
        </div>
      </div>

      <div class="panel stack quest-log-panel char-mid">
        <h2>Квести</h2>
        <div class="quest-log" id="quest-log"></div>
      </div>

      <div class="panel char-carousel" id="char-carousel">
        <div class="carousel-head">
          <button class="carousel-arrow" type="button" data-step="-1" aria-label="Попередня сторінка">‹</button>
          <h2 class="carousel-title" id="carousel-title">Атрибути</h2>
          <button class="carousel-arrow" type="button" data-step="1" aria-label="Наступна сторінка">›</button>
        </div>
        <div class="carousel-view">
          <div class="carousel-track" id="carousel-track">
            <div class="carousel-page stack" data-title="Атрибути"><div class="stat-list" id="attrs-list"></div></div>
            <div class="carousel-page stack" data-title="Характеристики"><div class="stat-list" id="stats-list"></div></div>
            <div class="carousel-page stack" data-title="Розвиток"><div class="stat-list" id="char-info"></div></div>
          </div>
        </div>
        <div class="carousel-dots" role="tablist">
          <button class="carousel-dot" type="button" data-page="0" role="tab">Атрибути</button>
          <button class="carousel-dot" type="button" data-page="1" role="tab">Характеристики</button>
          <button class="carousel-dot" type="button" data-page="2" role="tab">Розвиток</button>
        </div>
      </div>
    </div>

    <div class="stack char-bottom">
        <div class="panel stack">
          <h2>Спорядження</h2>
          <div class="equip-grid" id="equip-slots"></div>
          <a class="wf wf-link" href="inventory.html">Змінити спорядження</a>
        </div>

        <div class="panel stack">
          <h2>Володіння зброєю та навички</h2>
          <div class="stat-list" id="mastery-list"></div>
        </div>

        <a class="wf wf-link" href="game.html">Назад до локації</a>
    </div>
  </main>

  <script src="../assets/js/core.js" defer></script>
  <script src="../assets/js/ui.js" defer></script>
  <script src="../assets/js/data/levels.js" defer></script>
  <script src="../assets/js/data/items.js" defer></script>
  <script src="../assets/js/data/classes.js" defer></script>
  <script src="../assets/js/stats.js" defer></script>
  <script src="../assets/js/data/enemies.js" defer></script>
  <script src="../assets/js/data/skills.js" defer></script>
  <script src="../assets/js/quests.js" defer></script>
  <script src="../assets/js/rarity.js" defer></script>
  <script src="../assets/js/gearscore.js" defer></script>
  <script src="../assets/js/monstergear.js" defer></script>
  <script src="../assets/js/dungeon.js" defer></script>
  <script src="../assets/js/save.js" defer></script>
  <script src="../assets/js/character.js" defer></script>
  <script src="../assets/js/party.js" defer></script>
  <script src="../assets/js/battle.js" defer></script>
  <script src="../assets/js/data/routes.js" defer></script>
  <script src="../assets/js/travel.js" defer></script>
  <script src="../assets/js/game.js" defer></script>
  <script src="../assets/js/menu.js" defer></script>
</body>
</html>
